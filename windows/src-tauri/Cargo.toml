[package]
name = "openusage-windows"
version = "0.0.0"
description = "OpenUsage Windows system-tray application"
authors = ["OpenUsage contributors"]
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "openusage_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
tauri = { version = "=2.11.2", features = ["tray-icon"] }

