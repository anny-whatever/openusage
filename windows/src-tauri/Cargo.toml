[package]
name = "openusage-windows"
version = "0.0.0"
description = "OpenUsage Windows system-tray application"
authors = ["OpenUsage contributors"]
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "openusage_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
async-trait = "=0.1.89"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
futures-util = "=0.3.32"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream", "system-proxy"] }
rusqlite = { version = "=0.40.1", default-features = false, features = ["backup", "bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.11.2", features = ["tray-icon"] }
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
url = "=2.5.8"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading"] }
zeroize = "=1.9.0"
